---
include:
  # Lewa połowa (central) – ZMK Studio przez USB
  - board: nice_nano/nrf52840/zmk
    shield: dactyl_manuform_6x6_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # Prawa połowa (peripheral)
  - board: nice_nano/nrf52840/zmk
    shield: dactyl_manuform_6x6_right
  # DIAGNOSTYKA: prawa (peripheral) z logowaniem USB
  # Wgraj na prawą, podłącz USB, czytaj serial (115200) – widać skan matrycy i próby BLE
  - board: nice_nano/nrf52840/zmk
    shield: dactyl_manuform_6x6_right
    snippet: zmk-usb-logging
    artifact-name: dactyl_right_DEBUG_usblog
  # DIAGNOSTYKA: lewa (central) z logowaniem USB (BEZ Studio – USB zajęte przez log)
  # Wgraj na lewą, podłącz USB, czytaj serial – widać dlaczego central odrzuca parowanie (err 9)
  - board: nice_nano/nrf52840/zmk
    shield: dactyl_manuform_6x6_left
    snippet: zmk-usb-logging
    artifact-name: dactyl_left_DEBUG_usblog
  # Reset ustawień BLE (jednorazowo)
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
  # DIAGNOSTYKA: settings_reset z logiem USB
  # Wgraj na central, podłącz USB, czytaj serial – widać CZY reset faktycznie
  # czyści 'peripheral_addresses' (bond split). Potwierdzenie zamiast zgadywania.
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    snippet: zmk-usb-logging
    artifact-name: settings_reset_DEBUG_usblog
  # NAPRAWA: prawa (peripheral) z wymuszonym czyszczeniem bondu przy KAŻDYM starcie.
  # settings_reset NIE robi 'Erasing' na prawej połowie (potwierdzone logiem) –
  # peripheral nosi stary bond centrala w kółko → directed adv + Security err 9.
  # CLEAR_BONDS_ON_START czyści bond przez bt_unpair (inna ścieżka niż erase partycji).
  # Wgraj na prawą JEDNORAZOWO żeby wyczyścić, potem normalny right.uf2 bez tej flagi.
  # Log USB potwierdzi "Clearing all existing BLE bond information".
  - board: nice_nano/nrf52840/zmk
    shield: dactyl_manuform_6x6_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
    artifact-name: dactyl_right_CLEARBONDS
