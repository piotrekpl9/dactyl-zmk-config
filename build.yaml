---
include:
  # Lewa połowa (central) – ZMK Studio przez USB
  - board: nice_nano/nrf52840/zmk
    shield: dactyl_manuform_6x6_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # Prawa połowa (peripheral)
  - board: nice_nano/nrf52840/zmk
    shield: dactyl_manuform_6x6_right
  # Reset ustawień BLE – awaryjnie, gdy połowy przestaną się parować.
  # Wgrać na OBIE połowy, dać zbootować ~15 s, dopiero potem normalny firmware.
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
