# ─────────────────────────────────────────────────────────
# Konfiguracja ZMK – Dactyl Manuform 6x6 – PRAWA POŁOWA
# Rola: PERIPHERAL (łączy się z lewą przez BLE)
# ─────────────────────────────────────────────────────────

# Bluetooth
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_DEVICE_NAME="Dactyl R"

# Podzielona klawiatura – prawa połowa jest PERIPHERAL
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Uśpienie – WYŁĄCZONE na czas diagnozy parowania split.
# Hipoteza: soft-off/sleep na peripheralu przerywał zapis bondu BLE do flasha
# zanim się utrwalił → przy następnym połączeniu peripheral nie miał klucza
# → central żądał szyfrowania → Security failed err 9 (PAIR_NOT_SUPPORTED).
# Po udanym, trwałym sparowaniu można ostrożnie przywrócić ZMK_SLEEP
# (ale SOFT_OFF zostawić wyłączony – najczęstszy sprawca rozsynchronizowania bondu).
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_PM_SOFT_OFF=y
